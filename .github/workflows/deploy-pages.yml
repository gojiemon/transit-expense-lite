name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Compute base path
        run: echo "NEXT_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Set GAS endpoint (optional)
        run: |
          if [ -n "${{ vars.NEXT_PUBLIC_GAS_ENDPOINT }}" ]; then
            echo "NEXT_PUBLIC_GAS_ENDPOINT=${{ vars.NEXT_PUBLIC_GAS_ENDPOINT }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.NEXT_PUBLIC_GAS_ENDPOINT }}" ]; then
            echo "NEXT_PUBLIC_GAS_ENDPOINT=${{ secrets.NEXT_PUBLIC_GAS_ENDPOINT }}" >> $GITHUB_ENV
          fi

      - name: Build & Export
        run: npm run export

      - name: Add .nojekyll
        run: echo > out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

